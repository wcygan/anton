# Operator-created test fixture only. Never include this file in a Flux app.
apiVersion: v1
kind: Pod
metadata:
  name: notification-admission-check
  namespace: flux-system
  labels:
    app.kubernetes.io/name: notification-admission-check
spec:
  serviceAccountName: notification-controller-restricted
  automountServiceAccountToken: true
  restartPolicy: Never
  activeDeadlineSeconds: 300
  terminationGracePeriodSeconds: 5
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: docker.io/library/python@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
      command: [python3, -c, "import time; time.sleep(240)"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
