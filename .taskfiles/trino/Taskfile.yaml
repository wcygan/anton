version: '3'

tasks:
  summary:
    desc: Collect read-only Iceberg row and event counts through Trino
    silent: true
    cmd: mise exec -- python3 scripts/lakehouse-trino.py summary
    preconditions:
      - test -f kubeconfig
      - test -f {{.SCRIPTS_DIR}}/lakehouse-trino.py
      - which mise python3

  contract:
    desc: Collect read-only Iceberg table definitions through Trino
    silent: true
    cmd: mise exec -- python3 scripts/lakehouse-trino.py contract
    preconditions:
      - test -f kubeconfig
      - test -f {{.SCRIPTS_DIR}}/lakehouse-trino.py
      - which mise python3

  snapshots:
    desc: Collect read-only Iceberg snapshot metadata through Trino
    silent: true
    cmd: mise exec -- python3 scripts/lakehouse-trino.py snapshots
    preconditions:
      - test -f kubeconfig
      - test -f {{.SCRIPTS_DIR}}/lakehouse-trino.py
      - which mise python3

  flight-recorder-summary:
    desc: Collect read-only Flight Recorder counts and latest receipt through Trino
    silent: true
    cmd: mise exec -- python3 scripts/lakehouse-trino.py flight-recorder-summary
    preconditions:
      - test -f kubeconfig
      - test -f {{.SCRIPTS_DIR}}/lakehouse-trino.py
      - which mise python3

  flight-recorder-contract:
    desc: Collect read-only Flight Recorder table definitions through Trino
    silent: true
    cmd: mise exec -- python3 scripts/lakehouse-trino.py flight-recorder-contract
    preconditions:
      - test -f kubeconfig
      - test -f {{.SCRIPTS_DIR}}/lakehouse-trino.py
      - which mise python3

  flight-recorder-snapshots:
    desc: Collect read-only Flight Recorder snapshot metadata through Trino
    silent: true
    cmd: mise exec -- python3 scripts/lakehouse-trino.py flight-recorder-snapshots
    preconditions:
      - test -f kubeconfig
      - test -f {{.SCRIPTS_DIR}}/lakehouse-trino.py
      - which mise python3
