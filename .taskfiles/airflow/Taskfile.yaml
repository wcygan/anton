version: '3'

tasks:
  attempt-evidence:
    desc: Collect read-only evidence for one exact Spark Attempt
    silent: true
    env:
      RUN_ID: '{{.RUN_ID}}'
      TRY_NUMBER: '{{.TRY_NUMBER | default "1"}}'
      TARGET: '{{.TARGET | default "shadow"}}'
    cmd: >-
      mise exec -- python3 scripts/airflow-lakehouse.py lakehouse-evidence
      --run-id "$RUN_ID"
      --try-number "$TRY_NUMBER"
      --target "$TARGET"
    requires:
      vars: [RUN_ID]
    preconditions:
      - test -f kubeconfig
      - which mise python3

  attempt-evidence:complete:
    desc: Require complete live and retained evidence for one Spark Attempt
    silent: true
    env:
      RUN_ID: '{{.RUN_ID}}'
      TRY_NUMBER: '{{.TRY_NUMBER | default "1"}}'
      TARGET: '{{.TARGET | default "shadow"}}'
      LEDGER: '{{.LEDGER}}'
    cmd: >-
      mise exec -- python3 scripts/airflow-lakehouse.py lakehouse-evidence
      --run-id "$RUN_ID"
      --try-number "$TRY_NUMBER"
      --target "$TARGET"
      --ledger "$LEDGER"
      --require-complete
    requires:
      vars: [RUN_ID, LEDGER]
    preconditions:
      - test -f "$LEDGER"
      - test -f kubeconfig
      - which mise python3

  flight-recorder-evidence:
    desc: Require complete live Flight Recorder run evidence
    silent: true
    cmd: >-
      mise exec -- python3 scripts/airflow-lakehouse.py flight-recorder-initial-evidence
      --run-id "{{.RUN_ID}}" --try-number "{{.TRY_NUMBER | default "1"}}"
      --namespace-baseline "{{.NAMESPACE_BASELINE}}"
    requires:
      vars: [RUN_ID, NAMESPACE_BASELINE]
    preconditions:
      - test -f "{{.NAMESPACE_BASELINE}}"
      - test -f kubeconfig
      - which mise python3

  flight-recorder-replay-evidence:
    desc: Require replay evidence with unchanged Flight Recorder state
    silent: true
    cmd: >-
      mise exec -- python3 scripts/airflow-lakehouse.py flight-recorder-replay-evidence
      --run-id "{{.RUN_ID}}" --try-number "{{.TRY_NUMBER | default "1"}}"
      --baseline "{{.BASELINE}}"
    requires:
      vars: [RUN_ID, BASELINE]
    preconditions:
      - test -f "{{.BASELINE}}"
      - test -f kubeconfig
      - which mise python3

  flight-recorder-rejection-evidence:
    desc: Require one accepted Flight Recorder hour rejection
    silent: true
    cmd: >-
      mise exec -- python3 scripts/airflow-lakehouse.py flight-recorder-rejection-evidence
      --run-id "{{.RUN_ID}}" --try-number "{{.TRY_NUMBER | default "1"}}"
    requires:
      vars: [RUN_ID]
    preconditions:
      - test -f kubeconfig
      - which mise python3

  shadow-gate:
    desc: Validate retained evidence for the five-run Airflow shadow gate
    cmds:
      - mise exec -- python3 scripts/validate-airflow-shadow-gate.py --ledger "{{.LEDGER}}"
    requires:
      vars: [LEDGER]
    preconditions:
      - test -f "{{.LEDGER}}"
      - which mise python3
