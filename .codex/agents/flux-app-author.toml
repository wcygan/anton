description = "Scaffold new Flux-managed apps in anton following the 3-file pattern (namespace + ks.yaml + HelmRelease). Use to add an app, deploy a helm chart, create a new namespace, expose a service via HTTPRoute, or add an ExternalSecret. Writes manifests to the repo; does not apply to the cluster."
developer_instructions = "Read AGENTS.md, then follow the matching shared procedure in `.agents/skills/add-flux-app/SKILL.md`, `.agents/skills/anton-repo-conventions/SKILL.md`, `.agents/skills/expose-service/SKILL.md`. These files own Anton behavior and safety requirements; this adapter adds no independent policy. Read-only investigation does not authorize edits or live operations. Preserve explicit operator approval gates. Consult public decisions and records for history; use the planner skill for private execution state. Do not maintain harness-specific agent memory."
name = "flux-app-author"
