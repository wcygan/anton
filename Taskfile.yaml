---
version: '3'

set: [pipefail]
shopt: [globstar]

vars:
  BOOTSTRAP_DIR: '{{.ROOT_DIR}}/bootstrap'
  KUBERNETES_DIR: '{{.ROOT_DIR}}/kubernetes'
  SCRIPTS_DIR: '{{.ROOT_DIR}}/scripts'
  TALOS_DIR: '{{.ROOT_DIR}}/talos'
  PRIVATE_DIR: '{{.ROOT_DIR}}/.private'
  TALOSCONFIG: '{{.ROOT_DIR}}/talos/clusterconfig/talosconfig'

env:
  KUBECONFIG: '{{.ROOT_DIR}}/kubeconfig'
  SOPS_AGE_KEY_FILE: '{{.ROOT_DIR}}/age.key'
  TALOSCONFIG: '{{.TALOSCONFIG}}'

includes:
  bootstrap: .taskfiles/bootstrap
  security: .taskfiles/security
  talos: .taskfiles/talos

tasks:

  default: task --list

  storage:image-inventory:
    desc: Inventory node image references and disk usage without cleanup
    cmd: python3 scripts/node-image-inventory.py --output .private/reclamation/node-images-latest.json {{.CLI_ARGS}}
    preconditions:
      - which python3 kubectl talosctl
      - test -f {{.KUBECONFIG}}

  drain:node:
    desc: Evict the API proxy first, then drain one already-cordoned node
    prompt: This will evict workloads from the selected node. Continue?
    env:
      DRAIN_NODE: '{{.NODE}}'
      DRAIN_CONTEXT: '{{.CONTEXT}}'
      DRAIN_CLUSTER_UID: '{{.CLUSTER_UID}}'
      DRAIN_NODE_UID: '{{.NODE_UID}}'
      DRAIN_OPERATOR_UID: '{{.OPERATOR_UID}}'
      DRAIN_TIMEOUT: '{{.TIMEOUT}}'
    vars:
      TIMEOUT: '{{.TIMEOUT | default "600"}}'
      DELETE_EMPTYDIR_DATA: '{{.DELETE_EMPTYDIR_DATA | default "false"}}'
    cmd: >-
      python3 scripts/drain-node.py
      --node "$DRAIN_NODE"
      --expected-context "$DRAIN_CONTEXT"
      --expected-cluster-uid "$DRAIN_CLUSTER_UID"
      --expected-node-uid "$DRAIN_NODE_UID"
      --expected-operator-uid "$DRAIN_OPERATOR_UID"
      --timeout "$DRAIN_TIMEOUT"
      {{if eq .DELETE_EMPTYDIR_DATA "true"}}--delete-emptydir-data{{end}}
    requires:
      vars: [NODE, CONTEXT, CLUSTER_UID, NODE_UID, OPERATOR_UID]
    preconditions:
      - which python3 kubectl
      - test -f {{.KUBECONFIG}}

  reconcile:
    desc: Force Flux to pull in changes from your Git repository
    cmd: mise exec -- flux --namespace flux-system reconcile kustomization flux-system --with-source
    preconditions:
      - test -f {{.KUBECONFIG}}
      - test -f {{.ROOT_DIR}}/.mise.toml
      - which mise

  qmd:bootstrap:
    desc: Rebuild the local QMD index for public documentation
    cmds:
      - find .qmd -maxdepth 1 -name 'index.sqlite*' -delete
      - qmd update
      - qmd embed -c anton-docs
    preconditions:
      - test -f .qmd/index.yml
      - which qmd

  contracts:validate:
    desc: Validate committed cluster operation contracts
    cmds:
      - python3 scripts/validate-public-privacy.py
      - python3 scripts/validate-documentation.py
      - python3 scripts/validate-flux-contract.py
      - python3 scripts/validate-flux-postbuild-contract.py
      - python3 scripts/validate-log-contract.py
      - python3 scripts/validate-storage-contract.py
      - python3 scripts/validate-spark-runtime-contract.py
      - python3 scripts/validate-external-secret-contract.py
      - python3 scripts/validate-target-contract.py
      - python3 -m unittest discover -s scripts/tests -p 'test_*.py'
    preconditions:
      - which flux kustomize python3 yq

  external-secrets:force-refresh:
    desc: Force one approved ExternalSecret to refresh from 1Password
    prompt: This mutates one ExternalSecret annotation. Continue?
    env:
      ANTON_REFRESH_NAMESPACE: '{{.NAMESPACE}}'
      ANTON_REFRESH_NAME: '{{.NAME}}'
    cmd: scripts/force-external-secret-refresh.sh "$ANTON_REFRESH_NAMESPACE" "$ANTON_REFRESH_NAME"
    requires:
      vars: [NAMESPACE, NAME]
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which kubectl mise python3
