apiVersion: batch/v1
kind: CronJob
metadata:
  name: iceberg-log-spark
  namespace: iceberg-demo
  labels:
    app.kubernetes.io/name: iceberg-log-spark
    app.kubernetes.io/part-of: iceberg-demo
spec:
  schedule: "23 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: iceberg-log-spark
        spec:
          serviceAccountName: iceberg-spark
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 185
            runAsGroup: 185
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: submit
              # Pinned Harbor image published from the local Spark fixture build.
              image: 192.168.1.106/library/iceberg-log-spark:0.1.0@sha256:e10e24346948f95e2d9033687b2556ea094c32a087e093c0868fab77be7ceeca
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  exec /opt/spark/bin/spark-submit \
                    --master k8s://https://kubernetes.default.svc \
                    --deploy-mode cluster \
                    --name iceberg-log-spark \
                    --conf spark.kubernetes.namespace=iceberg-demo \
                    --conf spark.kubernetes.authenticate.driver.serviceAccountName=iceberg-spark \
                    --conf spark.kubernetes.container.image=192.168.1.106/library/iceberg-log-spark:0.1.0@sha256:e10e24346948f95e2d9033687b2556ea094c32a087e093c0868fab77be7ceeca \
                    --conf spark.executor.instances=1 \
                    --conf spark.driver.cores=1 --conf spark.driver.memory=768m \
                    --conf spark.executor.cores=1 --conf spark.executor.memory=768m \
                    --conf spark.kubernetes.driver.request.cores=100m \
                    --conf spark.kubernetes.executor.request.cores=100m \
                    --conf spark.kubernetes.driverEnv.AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
                    --conf spark.kubernetes.driverEnv.AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
                    --conf spark.executorEnv.AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
                    --conf spark.executorEnv.AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
                    --conf spark.kubernetes.driverEnv.AWS_REGION="$AWS_REGION" \
                    --conf spark.executorEnv.AWS_REGION="$AWS_REGION" \
                    local:///opt/spark/work-dir/transform.py
              envFrom:
                - secretRef:
                    name: iceberg-spark-s3
              env:
                - name: AWS_REGION
                  value: us-east-1
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: spark-tmp
                  mountPath: /tmp
          volumes:
            - name: spark-tmp
              emptyDir: {}
