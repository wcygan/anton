apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iceberg-spark-s3
  namespace: iceberg-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: iceberg-spark-s3
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: "seaweedfs-iceberg/warehouse-access-key"
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: "seaweedfs-iceberg/warehouse-secret-key"
