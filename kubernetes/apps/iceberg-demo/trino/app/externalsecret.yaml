---
# Dedicated warehouse identity; values remain in 1Password and are injected
# into Trino pods through Helm's envFrom support.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trino-warehouse-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: trino-warehouse-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        AWS_ACCESS_KEY_ID: "{{ .warehouseAccessKey }}"
        AWS_SECRET_ACCESS_KEY: "{{ .warehouseSecretKey }}"
  data:
    - secretKey: warehouseAccessKey
      remoteRef:
        key: "seaweedfs-iceberg/warehouse-access-key"
    - secretKey: warehouseSecretKey
      remoteRef:
        key: "seaweedfs-iceberg/warehouse-secret-key"
