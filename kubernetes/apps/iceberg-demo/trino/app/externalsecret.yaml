---
# Dedicated read-only identities; values remain in 1Password and are injected
# into Trino pods through Helm's envFrom support.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trino-iceberg-credentials
  annotations:
    anton.wcygan.net/secret-refresh-class: development
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: trino-iceberg-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        AWS_ACCESS_KEY_ID: "{{ .warehouseAccessKey }}"
        AWS_SECRET_ACCESS_KEY: "{{ .warehouseSecretKey }}"
        SHADOW_ACCESS_KEY_ID: "{{ .shadowAccessKey }}"
        SHADOW_SECRET_ACCESS_KEY: "{{ .shadowSecretKey }}"
  data:
    - secretKey: warehouseAccessKey
      remoteRef:
        key: "seaweedfs-iceberg-reader/reader-access-key"
    - secretKey: warehouseSecretKey
      remoteRef:
        key: "seaweedfs-iceberg-reader/reader-secret-key"
    - secretKey: shadowAccessKey
      remoteRef:
        key: "seaweedfs-iceberg-shadow-reader/reader-access-key"
    - secretKey: shadowSecretKey
      remoteRef:
        key: "seaweedfs-iceberg-shadow-reader/reader-secret-key"
