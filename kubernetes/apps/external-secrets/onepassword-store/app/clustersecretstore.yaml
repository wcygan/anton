---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-connect
spec:
  provider:
    onepasswordSDK:
      vault: anton
      # Cache successful reads to absorb overlapping reconciles and retry bursts.
      # Keep the short upstream default TTL because this feature is experimental.
      cache:
        ttl: 5m
        maxSize: 100
      auth:
        serviceAccountSecretRef:
          name: onepassword-sdk-token
          namespace: external-secrets
          key: token
