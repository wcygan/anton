---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airflow
spec:
  interval: 1h
  timeout: 20m
  chart:
    spec:
      chart: airflow
      version: 1.22.0
      sourceRef:
        kind: HelmRepository
        name: apache-airflow
      interval: 15m
  values:
    airflowVersion: "3.2.2"
    executor: KubernetesExecutor
    allowPodLaunching: true
    multiNamespaceMode: false

    images:
      airflow:
        repository: 192.168.1.106/library/airflow-runtime
        tag: 3.2.2-apache.11
        digest: sha256:dc46d82b8d7d84c405e8d9e2b0ec2b4a0dbc6585a10c8dc26a0cdf8b58d89485
        pullPolicy: IfNotPresent
      # The chart does not expose a digest field for the pod template image.
      # Split the digest at its colon so the rendered reference stays pinned.
      pod_template:
        repository: 192.168.1.106/library/airflow-runtime@sha256
        tag: dc46d82b8d7d84c405e8d9e2b0ec2b4a0dbc6585a10c8dc26a0cdf8b58d89485
        pullPolicy: IfNotPresent

    # ESO creates one consumer-shaped Secret from the 1Password item.
    # The connection value contains URL-encoded credentials.
    data:
      metadataSecretName: airflow-postgres-bootstrap
    enableBuiltInSecretEnvVars:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: false
      AIRFLOW_CONN_AIRFLOW_DB: false
    extraEnv: |-
      - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
        valueFrom:
          secretKeyRef:
            name: airflow-postgres-bootstrap
            key: connection
      - name: AIRFLOW_CONN_AIRFLOW_DB
        valueFrom:
          secretKeyRef:
            name: airflow-postgres-bootstrap
            key: connection
    fernetKeySecretName: airflow-postgres-bootstrap
    jwtSecretName: airflow-postgres-bootstrap

    apiServer:
      enabled: true
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi

    webserver:
      enabled: false

    scheduler:
      enabled: true
      replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 768Mi
        limits:
          cpu: "1"
          memory: 1536Mi
      logGroomerSidecar:
        enabled: false

    dagProcessor:
      enabled: true
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi

    triggerer:
      enabled: true
      replicas: 1
      persistence:
        enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
      logGroomerSidecar:
        enabled: false

    workers:
      kubernetes:
        serviceAccount:
          create: true
          name: airflow-spark-submit
          automountServiceAccountToken: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 768Mi
        terminationGracePeriodSeconds: 30
        safeToEvict: true

    migrateDatabaseJob:
      enabled: true
      # Flux waits for workloads during Helm actions. A post-install hook would
      # run only after those workloads pass their migration init containers.
      useHelmHooks: false
      applyCustomEnv: false
      env:
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          valueFrom:
            secretKeyRef:
              name: airflow-postgres-bootstrap
              key: connection
        - name: AIRFLOW_CONN_AIRFLOW_DB
          valueFrom:
            secretKeyRef:
              name: airflow-postgres-bootstrap
              key: connection
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 768Mi

    createUserJob:
      enabled: false

    cleanup:
      enabled: true
      schedule: "*/15 * * * *"
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi

    dags:
      persistence:
        enabled: false
      gitSync:
        enabled: false

    logs:
      persistence:
        enabled: false
      emptyDirConfig:
        sizeLimit: 512Mi

    config:
      core:
        load_examples: "False"
        dags_are_paused_at_creation: "False"
      kubernetes_executor:
        worker_container_repository: 192.168.1.106/library/airflow-runtime@sha256
        worker_container_tag: dc46d82b8d7d84c405e8d9e2b0ec2b4a0dbc6585a10c8dc26a0cdf8b58d89485
        delete_worker_pods: "False"
        delete_worker_pods_on_failure: "False"

    postgresql:
      enabled: false
    redis:
      enabled: false
    pgbouncer:
      enabled: false
    statsd:
      enabled: false
    flower:
      enabled: false
