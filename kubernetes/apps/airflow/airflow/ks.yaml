---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: airflow
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps/airflow/airflow/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: airflow
  dependsOn:
    - name: airflow-database
      namespace: airflow
    - name: airflow-flight-recorder
      namespace: airflow
  wait: true
  timeout: 20m
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
