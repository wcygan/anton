---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-source-raw
  annotations:
    anton.wcygan.net/secret-refresh-class: development
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: loki-source-raw
    creationPolicy: Owner
  data:
    - secretKey: RAW_ACCESS_KEY_ID
      remoteRef:
        key: seaweedfs-iceberg/raw-access-key
    - secretKey: RAW_SECRET_ACCESS_KEY
      remoteRef:
        key: seaweedfs-iceberg/raw-secret-key
