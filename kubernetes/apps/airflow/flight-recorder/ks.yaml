---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: airflow-flight-recorder
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps/airflow/flight-recorder/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: airflow
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
  wait: false
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
