---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kyverno
  values:
    # Admission is the only controller needed for image verification.
    admissionController:
      replicas: 3
      container:
        image:
          tag: v1.19.2@sha256:c8c4dd09e720d2cd7fd24ca73ac28e46651001372f988e0cba3f2f612f04b955
      initContainer:
        image:
          tag: v1.19.2@sha256:27f3cc52e628559b56d08363b85316819802086c9808606914f7805a244148f4
      podDisruptionBudget:
        minAvailable: 2
    backgroundController:
      enabled: false
    cleanupController:
      enabled: false
    reportsController:
      enabled: false
    features:
      forceFailurePolicyIgnore:
        enabled: false
      policyExceptions:
        enabled: false
      admissionReports:
        enabled: false
      policyReports:
        enabled: false
    config:
      # Explicit trust policies cover ReplicaSets as well as Pods and Deployments.
      resourceFiltersExclude:
        - "[ReplicaSet,*,*]"
        - "[ReplicaSet/?*,*,*]"
      excludeKyvernoNamespace: true
      # App trust identities and workload scopes belong to private policies.
      # Do not use an objectSelector opt-out label here.
      webhooks:
        namespaceSelector:
          matchLabels:
            anton.wcygan.net/image-verification: enabled
