---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-controller-restricted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: notification-controller-restricted
rules:
  - apiGroups: [notification.toolkit.fluxcd.io]
    resources: [receivers, alerts, providers]
    verbs: [get, list, watch]
  - apiGroups: [notification.toolkit.fluxcd.io]
    resources: [receivers, receivers/status]
    resourceNames: [github-webhook]
    verbs: [patch, update]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [github-webhook-token-secret]
    verbs: [get]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    verbs: [get, list, watch]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list, watch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    resourceNames: [flux-system]
    verbs: [patch]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    resourceNames: [flux-system]
    verbs: [patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [notification-controller-leader-election]
    verbs: [get, update, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: notification-controller-restricted
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: notification-controller-restricted
subjects:
  - kind: ServiceAccount
    name: notification-controller-restricted
    namespace: flux-system
