---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: auxiliary-root
  namespace: flux-system
spec:
  # Authenticate and verify the source before enabling private workloads.
  suspend: false
  interval: 1m
  path: ./clusters/anton
  prune: true
  sourceRef:
    kind: GitRepository
    name: auxiliary
    namespace: flux-system
  wait: false
