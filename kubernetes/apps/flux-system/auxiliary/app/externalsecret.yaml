---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auxiliary-git-auth
  namespace: flux-system
  annotations:
    anton.wcygan.net/secret-refresh-class: stable
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: auxiliary-git-auth
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: auxiliary-git/username
    - secretKey: password
      remoteRef:
        key: auxiliary-git/password
