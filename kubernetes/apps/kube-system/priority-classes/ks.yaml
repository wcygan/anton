---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: priority-classes
spec:
  interval: 1h
  path: ./kubernetes/apps/kube-system/priority-classes/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # The API server rejects a Pod that names a missing PriorityClass, so every
  # workload that sets one of these classes depends on this Kustomization.
  wait: true
