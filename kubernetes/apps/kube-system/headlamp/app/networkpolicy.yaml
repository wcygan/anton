---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headlamp-isolation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: headlamp
      app.kubernetes.io/instance: headlamp
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Select the proxy for this exact Ingress, not every tailnet proxy.
        # Namespace and pod selectors in one peer are an AND condition.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/managed: "true"
              tailscale.com/parent-resource: headlamp
              tailscale.com/parent-resource-ns: kube-system
              tailscale.com/parent-resource-type: ingress
      ports:
        # Service :80 maps to the chart's named container port (:4466).
        - port: http
          protocol: TCP
