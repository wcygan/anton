---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authoritative-writer
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: lakehouse
  dependsOn:
    - name: spark-operator
      namespace: spark-system
    - name: external-secrets
      namespace: external-secrets
    - name: seaweedfs-config
      namespace: storage
  path: ./kubernetes/apps/lakehouse/authoritative-writer/app
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
