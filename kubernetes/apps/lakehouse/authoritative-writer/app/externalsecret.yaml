---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authoritative-fixture-s3
  annotations:
    anton.wcygan.net/secret-refresh-class: development
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: authoritative-fixture-s3
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .warehouseAccessKey }}"
        AWS_SECRET_ACCESS_KEY: "{{ .warehouseSecretKey }}"
        core-site.xml: |
          <?xml version="1.0"?>
          <configuration>
            <property>
              <name>fs.s3a.access.key</name>
              <value>{{ .sparkEventsWriterAccessKey }}</value>
            </property>
            <property>
              <name>fs.s3a.secret.key</name>
              <value>{{ .sparkEventsWriterSecretKey }}</value>
            </property>
            <property>
              <name>fs.s3a.aws.credentials.provider</name>
              <value>org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider</value>
            </property>
          </configuration>
  data:
    - secretKey: warehouseAccessKey
      remoteRef:
        key: seaweedfs-iceberg/warehouse-access-key
    - secretKey: warehouseSecretKey
      remoteRef:
        key: seaweedfs-iceberg/warehouse-secret-key
    - secretKey: sparkEventsWriterAccessKey
      remoteRef:
        key: seaweedfs-spark-events/writer-access-key
    - secretKey: sparkEventsWriterSecretKey
      remoteRef:
        key: seaweedfs-spark-events/writer-secret-key
