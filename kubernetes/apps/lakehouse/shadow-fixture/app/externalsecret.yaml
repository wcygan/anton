---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shadow-fixture-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: shadow-fixture-s3
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .shadowAccessKey }}"
        AWS_SECRET_ACCESS_KEY: "{{ .shadowSecretKey }}"
        core-site.xml: |
          <?xml version="1.0"?>
          <configuration>
            <property>
              <name>fs.s3a.access.key</name>
              <value>{{ .sparkEventsWriterAccessKey }}</value>
            </property>
            <property>
              <name>fs.s3a.secret.key</name>
              <value>{{ .sparkEventsWriterSecretKey }}</value>
            </property>
            <property>
              <name>fs.s3a.aws.credentials.provider</name>
              <value>org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider</value>
            </property>
          </configuration>
  data:
    - secretKey: shadowAccessKey
      remoteRef:
        key: seaweedfs-iceberg-shadow/shadow-access-key
    - secretKey: shadowSecretKey
      remoteRef:
        key: seaweedfs-iceberg-shadow/shadow-secret-key
    - secretKey: sparkEventsWriterAccessKey
      remoteRef:
        key: seaweedfs-spark-events/writer-access-key
    - secretKey: sparkEventsWriterSecretKey
      remoteRef:
        key: seaweedfs-spark-events/writer-secret-key
