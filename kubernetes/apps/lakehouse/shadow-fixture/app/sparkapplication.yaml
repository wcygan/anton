---
apiVersion: spark.apache.org/v1
kind: SparkApplication
metadata:
  name: lakehouse-shadow-fixture
  labels:
    app.kubernetes.io/name: lakehouse-shadow-fixture
    anton.io/retain-failed-pod: "true"
spec:
  pyFiles: "local:///opt/spark/application/transform.py"
  deploymentMode: ClusterMode
  runtimeVersions:
    sparkVersion: "4.1.3"
  sparkConf:
    spark.kubernetes.container.image: 192.168.1.106/library/spark-runtime@sha256:f76b38d07d0c0b1784e962073c918176f116359f7e3c8e82e0e0efbb939563e7
    spark.kubernetes.authenticate.driver.serviceAccountName: shadow-fixture
    spark.executor.instances: "1"
    spark.driver.cores: "1"
    spark.driver.memory: 768m
    spark.driver.memoryOverhead: 256m
    spark.executor.cores: "1"
    spark.executor.memory: 768m
    spark.executor.memoryOverhead: 256m
    spark.kubernetes.driver.request.cores: 100m
    spark.kubernetes.executor.request.cores: 100m
    spark.eventLog.enabled: "true"
    spark.eventLog.dir: s3a://spark-events/events/
    spark.eventLog.compress: "true"
    spark.eventLog.rolling.enabled: "true"
    spark.eventLog.rolling.maxFileSize: 64m
    spark.hadoop.fs.s3a.endpoint: http://seaweedfs-s3.storage.svc.cluster.local:8333
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
    spark.sql.catalog.lake: org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.lake.io-impl: org.apache.iceberg.aws.s3.S3FileIO
    spark.sql.iceberg.write.format-version: "2"
  driverSpec:
    podTemplateSpec:
      metadata:
        labels:
          anton.io/retain-failed-pod: "true"
      spec:
        containers:
          - name: spark-kubernetes-driver
            imagePullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: shadow-fixture-s3
            env:
              - name: AWS_REGION
                value: us-east-1
              - name: HADOOP_CONF_DIR
                value: /etc/hadoop-event-log
              - name: ICEBERG_WAREHOUSE
                value: s3://iceberg-shadow
              - name: ICEBERG_CATALOG_URI
                value: http://seaweedfs-iceberg.storage.svc.cluster.local:8181
              - name: S3_ENDPOINT
                value: http://seaweedfs-s3.storage.svc.cluster.local:8333
            volumeMounts:
              - name: event-log-hadoop-config
                mountPath: /etc/hadoop-event-log
                readOnly: true
        volumes:
          - name: event-log-hadoop-config
            secret:
              secretName: shadow-fixture-s3
              items:
                - key: core-site.xml
                  path: core-site.xml
  executorSpec:
    podTemplateSpec:
      metadata:
        labels:
          anton.io/retain-failed-pod: "true"
      spec:
        containers:
          - name: spark-kubernetes-executor
            imagePullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: shadow-fixture-s3
            env:
              - name: AWS_REGION
                value: us-east-1
              - name: HADOOP_CONF_DIR
                value: /etc/hadoop-event-log
              - name: ICEBERG_WAREHOUSE
                value: s3://iceberg-shadow
              - name: ICEBERG_CATALOG_URI
                value: http://seaweedfs-iceberg.storage.svc.cluster.local:8181
              - name: S3_ENDPOINT
                value: http://seaweedfs-s3.storage.svc.cluster.local:8333
            volumeMounts:
              - name: event-log-hadoop-config
                mountPath: /etc/hadoop-event-log
                readOnly: true
        volumes:
          - name: event-log-hadoop-config
            secret:
              secretName: shadow-fixture-s3
              items:
                - key: core-site.xml
                  path: core-site.xml
  applicationTolerations:
    restartConfig:
      restartPolicy: Never
    resourceRetainPolicy: OnFailure
