---
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: lakehouse-shadow-fixture
  labels:
    app.kubernetes.io/name: lakehouse-shadow-fixture
    anton.io/retain-failed-pod: "true"
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: 192.168.1.106/library/spark-runtime@sha256:28efc7381ed7560ee806aeead8ba864daf989126bdb8f0f5b7d668beeafcb056
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark/work-dir/transform.py
  sparkVersion: 4.1.3
  restartPolicy:
    type: Never
  timeToLiveSeconds: 604800
  sparkConf:
    spark.eventLog.enabled: "true"
    spark.eventLog.dir: s3a://spark-events/events/
    spark.eventLog.compress: "true"
    spark.eventLog.rolling.enabled: "true"
    spark.eventLog.rolling.maxFileSize: 64m
    spark.hadoop.fs.s3a.endpoint: http://seaweedfs-s3.storage.svc.cluster.local:8333
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
    spark.hadoop.fs.s3a.aws.credentials.provider: software.amazon.awssdk.auth.credentials.EnvironmentVariableCredentialsProvider
    spark.sql.catalog.lake: org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.lake.io-impl: org.apache.iceberg.aws.s3.S3FileIO
    spark.sql.iceberg.write.format-version: "2"
  driver:
    cores: 1
    coreRequest: 100m
    memory: 768m
    memoryOverhead: 256m
    serviceAccount: shadow-fixture
    labels:
      anton.io/retain-failed-pod: "true"
    envFrom:
      - secretRef:
          name: shadow-fixture-s3
    env:
      - name: AWS_REGION
        value: us-east-1
      - name: ICEBERG_WAREHOUSE
        value: s3://iceberg-shadow
      - name: ICEBERG_CATALOG_URI
        value: http://seaweedfs-iceberg.storage.svc.cluster.local:8181
      - name: S3_ENDPOINT
        value: http://seaweedfs-s3.storage.svc.cluster.local:8333
  executor:
    instances: 1
    deleteOnTermination: false
    cores: 1
    coreRequest: 100m
    memory: 768m
    memoryOverhead: 256m
    labels:
      anton.io/retain-failed-pod: "true"
    envFrom:
      - secretRef:
          name: shadow-fixture-s3
    env:
      - name: AWS_REGION
        value: us-east-1
