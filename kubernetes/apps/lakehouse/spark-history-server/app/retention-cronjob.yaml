---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: spark-retention-cleaner
  labels:
    app.kubernetes.io/name: spark-retention-cleaner
    app.kubernetes.io/part-of: lakehouse
spec:
  schedule: "17,47 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: spark-retention-cleaner
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: alpine/k8s:1.36.2@sha256:44ef4942e171939b9c665a4a84beb80e2dcdb9a24330d4651cfdfd2e9deecc47
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /opt/anton/retain-spark-pods.sh
              env:
                - name: SUCCESS_RETENTION_SECONDS
                  value: "3600"
                - name: FAILURE_RETENTION_SECONDS
                  value: "86400"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: cleaner
                  mountPath: /opt/anton/retain-spark-pods.sh
                  subPath: retain-spark-pods.sh
                  readOnly: true
          volumes:
            - name: cleaner
              configMap:
                name: spark-retention-cleaner
