---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-retention-cleaner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-retention-cleaner
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-retention-cleaner
subjects:
  - kind: ServiceAccount
    name: spark-retention-cleaner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-retention-cleaner
