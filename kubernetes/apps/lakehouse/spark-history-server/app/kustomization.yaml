---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: spark-history-config
    files:
      - spark-defaults.conf=./spark-defaults.conf
  - name: spark-retention-cleaner
    files:
      - retain-spark-pods.sh=./retain-spark-pods.sh
    options:
      disableNameSuffixHash: true
resources:
  - ./externalsecret.yaml
  - ./serviceaccount.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./retention-rbac.yaml
  - ./retention-cronjob.yaml
