---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spark-history-server
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: lakehouse
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: seaweedfs-config
      namespace: storage
  path: ./kubernetes/apps/lakehouse/spark-history-server/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
