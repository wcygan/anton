---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-spark-submit
  namespace: lakehouse
rules:
  - apiGroups: [spark.apache.org]
    resources: [sparkapplications]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-spark-submit
  namespace: lakehouse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-spark-submit
subjects:
  - kind: ServiceAccount
    name: airflow-spark-submit
    namespace: airflow
  - kind: ServiceAccount
    name: airflow-triggerer
    namespace: airflow
