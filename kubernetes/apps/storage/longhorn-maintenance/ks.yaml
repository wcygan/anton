apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-maintenance
spec:
  interval: 1h
  path: ./kubernetes/apps/storage/longhorn-maintenance/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: storage
  dependsOn:
    - name: longhorn
  wait: false
