apiVersion: v1
kind: ServiceAccount
metadata:
  name: snapshot-retention
  namespace: storage
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: snapshot-retention-content
rules:
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotcontents]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: snapshot-retention-content
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: snapshot-retention-content
subjects:
  - kind: ServiceAccount
    name: snapshot-retention
    namespace: storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: snapshot-retention-namespace
rules:
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: snapshot-retention
  namespace: storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: snapshot-retention-namespace
subjects:
  - kind: ServiceAccount
    name: snapshot-retention
    namespace: storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: snapshot-retention-health
  namespace: storage
rules:
  - apiGroups: [longhorn.io]
    resources: [volumes, snapshots]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [cluster-recovery-journal]
    verbs: [get]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [cluster-recovery]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: snapshot-retention-health
  namespace: storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: snapshot-retention-health
subjects:
  - kind: ServiceAccount
    name: snapshot-retention
    namespace: storage
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: snapshot-retention
  namespace: storage
spec:
  schedule: "30 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cluster-recovery
            app.kubernetes.io/component: snapshot-retention
        spec:
          serviceAccountName: snapshot-retention
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retention
              image: docker.io/library/python:3.15-alpine@sha256:d44b1254cb92329418d164b22b20d86bbd3869d48e80e09e476531a409a728bb
              command: [python3, -u, /code/snapshot-retention.py, apply]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: code
                  mountPath: /code
                  readOnly: true
          volumes:
            - name: code
              configMap:
                name: cluster-recovery-code
