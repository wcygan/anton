apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: seaweedfs-s3-read-probe
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/component: s3
      app.kubernetes.io/instance: seaweedfs
  podMetricsEndpoints:
    - port: read-probe
      interval: 30s
