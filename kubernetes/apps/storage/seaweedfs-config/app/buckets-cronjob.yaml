---
# Storage owns bucket lifecycle. Workloads declare intent here; the mounted
# provisioner keeps ordinary S3 and S3 Tables behavior explicit and refuses a
# kind collision instead of deleting or replacing data.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: seaweedfs-buckets-ensure
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: provision-buckets
              image: amazon/aws-cli:2.36.14
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: seaweedfs-s3-config
              env:
                - name: AWS_EC2_METADATA_DISABLED
                  value: "true"
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
                - name: S3_ENDPOINT
                  value: http://seaweedfs-s3.storage.svc.cluster.local:8333
                - name: ORDINARY_BUCKETS
                  value: harbor loki iceberg-raw
                - name: TABLE_BUCKETS
                  value: iceberg-warehouse
              command:
                - /bin/sh
                - /opt/anton/provision-buckets.sh
              volumeMounts:
                - name: provisioner
                  mountPath: /opt/anton
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: provisioner
              configMap:
                name: seaweedfs-bucket-provisioner
