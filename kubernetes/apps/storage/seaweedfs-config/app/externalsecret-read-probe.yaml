apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-read-probe
  annotations:
    anton.wcygan.net/secret-refresh-class: stable
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: seaweedfs-read-probe
    creationPolicy: Owner
  # Reuse the existing read-only identity; never mount the admin S3 config.
  # Its only additional permission is Read:s3-read-probe.
  data:
    - secretKey: access-key
      remoteRef:
        key: seaweedfs-spark-events/reader-access-key
    - secretKey: secret-key
      remoteRef:
        key: seaweedfs-spark-events/reader-secret-key
