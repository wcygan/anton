---
# The Seaweed operator's generated Service only exposes the S3 API port. Keep
# the Iceberg REST catalog internal and select the operator-managed S3 pods by
# their stable labels rather than owning or patching the generated Service.
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-iceberg
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: s3
    app.kubernetes.io/instance: seaweedfs
    app.kubernetes.io/managed-by: seaweedfs-operator
    app.kubernetes.io/name: seaweedfs
  ports:
    - name: iceberg-rest
      port: 8181
      targetPort: 8181
      protocol: TCP
