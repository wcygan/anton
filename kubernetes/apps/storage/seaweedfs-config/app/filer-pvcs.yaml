# Pre-provision the operator's ordinal claims for staged metadata migration.
# Retain the metadata even if the app is accidentally removed from Git.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-filer-seaweedfs-filer-0
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-filer-seaweedfs-filer-1
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 4Gi
