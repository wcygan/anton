apiVersion: batch/v1
kind: CronJob
metadata:
  name: seaweedfs-durability-ensure
spec:
  suspend: false
  schedule: "23 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: weed-tool
              image: 192.168.1.106/library/seaweedfs-durable:4.48-durable1-growth1-sync1@sha256:63da1c585c2c1beae7b4ab223a7558b1b97e5f44a45755e578079a86a8d42420
              command: [/bin/sh, -ec, "cp /usr/bin/weed /tools/weed"]
              volumeMounts:
                - name: tools
                  mountPath: /tools
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 256Mi
                limits:
                  cpu: 100m
                  memory: 384Mi
          containers:
            - name: ensure-durability
              image: docker.io/library/python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
              command: [python3, /policy/ensure-durability.py]
              args:
                - --master=seaweedfs-master-0.seaweedfs-master-peer.storage:9333,seaweedfs-master-1.seaweedfs-master-peer.storage:9333,seaweedfs-master-2.seaweedfs-master-peer.storage:9333
                - --filers=seaweedfs-filer-0.seaweedfs-filer-peer.storage:8888,seaweedfs-filer-1.seaweedfs-filer-peer.storage:8888
              volumeMounts:
                - name: tools
                  mountPath: /tools
                  readOnly: true
                - name: policy
                  mountPath: /policy
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
          volumes:
            - name: tools
              emptyDir:
                sizeLimit: 384Mi
            - name: policy
              configMap:
                name: seaweedfs-durability-policy
