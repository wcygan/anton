---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: storage
configurations:
  - ./name-references.yaml
configMapGenerator:
  - name: seaweedfs-durability-policy
    files:
      - ./ensure-durability.py
  - name: seaweedfs-s3-read-probe
    files:
      - ./s3-read-probe.py
  - name: seaweedfs-bucket-provisioner
    files:
      - provision-buckets.sh=./provision-buckets.sh
      - prefix-marker=./prefix-marker
    options:
      disableNameSuffixHash: true
resources:
  - ./durability-cronjob.yaml
  - ./seaweed.yaml
  - ./pdb.yaml
  - ./prometheusrule.yaml
  - ./s3-read-alerts.yaml
  - ./s3-probe-monitor.yaml
  - ./filer-pvcs.yaml
  - ./filer-reader-rbac.yaml
  - ./externalsecret.yaml
  - ./externalsecret-read-probe.yaml
  - ./buckets-cronjob.yaml
  - ./httproute.yaml
