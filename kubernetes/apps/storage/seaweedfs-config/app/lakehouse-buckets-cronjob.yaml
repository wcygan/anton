---
# Create the dedicated lakehouse buckets without reusing Harbor's bucket.
# `iceberg-raw` is an ordinary S3 bucket; `iceberg-warehouse` must be a Seaweed
# S3 Table bucket for the REST catalog. The job uses the already-provisioned
# admin identity only for bucket creation; workloads use the scoped identities
# from `seaweedfs-s3-config`. Existing ordinary buckets are collisions: fail
# closed and never delete or replace their data.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: seaweedfs-lakehouse-buckets-ensure
spec:
  schedule: "37 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ensure-buckets
              image: amazon/aws-cli:2.36.19
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: seaweedfs-s3-config
              env:
                - name: AWS_EC2_METADATA_DISABLED
                  value: "true"
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
              command:
                - /bin/sh
                - -c
              args:
                - |
                  set -eu
                  endpoint="http://seaweedfs-s3.storage.svc.cluster.local:8333"
                  if aws --endpoint-url="$endpoint" s3api head-bucket --bucket iceberg-raw >/dev/null 2>&1; then
                    echo "iceberg-raw bucket present"
                  else
                    aws --endpoint-url="$endpoint" s3 mb s3://iceberg-raw
                    echo "iceberg-raw bucket created"
                  fi

                  table_bucket_arn="$(aws --endpoint-url="$endpoint" s3tables list-table-buckets \
                    --query 'tableBuckets[?name==`iceberg-warehouse`].arn | [0]' \
                    --output text 2>/dev/null || true)"
                  if [ -n "$table_bucket_arn" ] && [ "$table_bucket_arn" != "None" ] && \
                    aws --endpoint-url="$endpoint" s3tables get-table-bucket \
                    --table-bucket-arn "$table_bucket_arn" >/dev/null 2>&1; then
                    echo "iceberg-warehouse table bucket present"
                  else
                    if aws --endpoint-url="$endpoint" s3api head-bucket --bucket iceberg-warehouse >/dev/null 2>&1; then
                      echo "iceberg-warehouse exists as an ordinary bucket; refusing to replace it" >&2
                      exit 1
                    fi
                    if ! aws --endpoint-url="$endpoint" s3tables create-table-bucket \
                      --name iceberg-warehouse; then
                      echo "failed to create iceberg-warehouse table bucket; refusing fallback or deletion" >&2
                      exit 1
                    fi
                    echo "iceberg-warehouse table bucket created"
                  fi
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
