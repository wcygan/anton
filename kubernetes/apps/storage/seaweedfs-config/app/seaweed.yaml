---
apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: seaweedfs
  namespace: storage
  annotations:
    secret.reloader.stakater.com/reload: seaweedfs-s3-config
spec:
  image: chrislusf/seaweedfs:4.40
  master:
    version: 4.48@sha256:aba492e2a4e4c90bff795745e8e660affa1f09e7650f5981bd7bccd1a06cd931
    replicas: 3
    # Longhorn replicates blocks; it cannot flush buffered SeaweedFS appends.
    defaultReplication: "000"      # no Seaweed replication (ADR 0005)
    # Allocate one logical volume per growth event. The default batch of seven
    # exhausts sparse collection slots before the PVCs approach capacity.
    env:
      - name: WEED_MASTER_VOLUME_GROWTH_COPY_1
        value: "1"
    # Keep logical volumes small enough that each 120Gi volume server has
    # room for multiple collections. Existing volumes are unaffected; this
    # only increases the number of new volume slots available to S3 buckets.
    volumeSizeLimitMB: 5000         # 5 GB per volume file
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: seaweedfs
                app.kubernetes.io/component: master
                app.kubernetes.io/instance: seaweedfs
  volume:
    replicas: 3                     # one per node
    metricsPort: 9327
    maxVolumeCounts: 20             # 8 free slots per server at current use
    # Advertise the stable StatefulSet peer DNS while keeping startup independent
    # of headless-Service DNS resolution.
    ipBind: 0.0.0.0
    requests:
      storage: 120Gi
    storageClassName: longhorn      # default Longhorn SC; no NAD attachment here
    # Phase 1 scratch shakeout showed `replicas: 3` alone does not spread
    # across nodes (all three landed on k8s-2). Chart 0.1.14's Seaweed CRD
    # does NOT expose `topologySpreadConstraints` on any component, but does
    # expose `affinity` — use podAntiAffinity with the operator's pod labels
    # to force one-per-node. Labels verified against operator source at tag
    # 1.0.12 (internal/controller/controller_volume.go::labelsForVolumeServer):
    # app.kubernetes.io/name=seaweedfs, component=volume, instance=<cr-name>.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: seaweedfs
                app.kubernetes.io/component: volume
                app.kubernetes.io/instance: seaweedfs
  filer:
    replicas: 2                     # Phase 1 verdict: 2 holds under pod-kill
    # Embedded LevelDB is the S3 object index, not disposable runtime state.
    persistence:
      enabled: true
      mountPath: /data
      storageClassName: longhorn
      annotations:
        kustomize.toolkit.fluxcd.io/prune: disabled
      resources:
        requests:
          storage: 4Gi
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: seaweedfs
                app.kubernetes.io/component: filer
                app.kubernetes.io/instance: seaweedfs
  s3:
    volumes:
      - name: read-probe-code
        configMap:
          name: seaweedfs-s3-read-probe
      - name: read-probe-credentials
        secret:
          secretName: seaweedfs-read-probe
    sidecars:
      - name: read-probe
        image: docker.io/library/python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
        command: [python3, -u, /probe/s3-read-probe.py]
        env:
          - name: PYTHONDONTWRITEBYTECODE
            value: "1"
        ports:
          - name: read-probe
            containerPort: 9328
        startupProbe:
          httpGet:
            path: /ready
            port: read-probe
          periodSeconds: 5
          failureThreshold: 12
        readinessProbe:
          httpGet:
            path: /ready
            port: read-probe
        livenessProbe:
          httpGet:
            path: /ready
            port: read-probe
          initialDelaySeconds: 15
        resources:
          requests:
            cpu: 5m
            memory: 24Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: read-probe-code
            mountPath: /probe
            readOnly: true
          - name: read-probe-credentials
            mountPath: /credentials
            readOnly: true
    metricsPort: 9327
    replicas: 2                     # standalone Deployment HA per ADR 0019
    iam: false                      # explicit override — operator default is true
    # SeaweedFS 4.40's built-in Iceberg REST catalog is disabled unless this
    # listener is explicitly enabled. The operator exposes extraArgs but its
    # generated Service only publishes the S3 port, so the catalog gets a
    # separate Flux-managed Service below.
    extraArgs:
      - -port.iceberg=8181
    configSecret:
      name: seaweedfs-s3-config     # matches ExternalSecret target.name
      key: s3.json                  # matches ExternalSecret target.template.data key
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: seaweedfs
                app.kubernetes.io/component: s3
                app.kubernetes.io/instance: seaweedfs
