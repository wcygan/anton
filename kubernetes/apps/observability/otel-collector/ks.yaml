apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: otel-collector
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps/observability/otel-collector/app
  prune: true
  wait: true
  timeout: 10m
  targetNamespace: observability
  dependsOn:
    - name: loki
    - name: kube-prometheus-stack
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
        optional: false
