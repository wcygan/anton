apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
spec:
  interval: 1h
  chart:
    spec:
      chart: opentelemetry-collector
      version: 0.165.0
      sourceRef:
        kind: HelmRepository
        name: opentelemetry
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    mode: daemonset
    image:
      repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
      tag: 0.156.0
    command:
      name: otelcol-k8s
    presets:
      logsCollection:
        enabled: false
      kubernetesAttributes:
        enabled: true
    initContainers:
      - name: harden-checkpoint-directory
        image: busybox:1.38.0
        command:
          - /bin/sh
          - -ec
          - mkdir -p /var/lib/otelcol && chmod 0700 /var/lib/otelcol
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: varlibotelcol
            mountPath: /var/lib/otelcol
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    alternateConfig:
      extensions:
        file_storage:
          directory: /var/lib/otelcol
        health_check:
          endpoint: $${env:MY_POD_IP}:13133
      receivers:
        file_log:
          include:
            - /var/log/pods/*/*/*.log
          start_at: end
          include_file_name: false
          include_file_path: true
          operators:
            - type: container
              id: container-parser
              max_log_size: 256KiB
            - type: json_parser
              id: json-severity
              parse_from: body
              parse_to: attributes
              if: 'body matches "^\\s*\\{"'
      processors:
        batch:
          timeout: 2s
          send_batch_size: 256
          send_batch_max_size: 512
        memory_limiter:
          check_interval: 1s
          limit_mib: 384
          spike_limit_mib: 96
        transform/severity:
          error_mode: ignore
          log_statements:
            - context: log
              statements:
                - delete_key(resource.attributes, "severity")
                - set(log.severity_text, log.attributes["severity_text"]) where log.attributes["severity_text"] != nil
                - set(log.severity_text, log.attributes["level"]) where log.attributes["level"] != nil
                - set(log.severity_text, log.attributes["severity"]) where log.attributes["severity"] != nil
                # Only use text heuristics when the parser did not provide a
                # level. Matching any occurrence of "error" or "failed" in
                # a warning message turns normal klog warnings into errors.
                # Conventional klog prefixes (E/W) remain reliable signals.
                - set(log.severity_text, "fatal") where log.severity_text == nil and log.body != nil and IsMatch(log.body, "(?i)^(F[0-9]{4}|fatal|critical|panic)\\b|(level|severity)[\"'=:\\s]+[\"']?(fatal|critical|panic)\\b")
                - set(log.severity_text, "error") where log.severity_text == nil and log.body != nil and IsMatch(log.body, "(?i)^(E[0-9]{4}|error|err|failed|failure|panic|exception)\\b|(level|severity)[\"'=:\\s]+[\"']?(error|err)\\b")
                - set(log.severity_text, "warn") where log.severity_text == nil and log.body != nil and IsMatch(log.body, "(?i)^(W[0-9]{4}|warn|warning)\\b|(level|severity)[\"'=:\\s]+[\"']?(warn|warning)\\b")
                - set(log.severity_text, "debug") where log.severity_text == nil and log.body != nil and IsMatch(log.body, "(?i)^(D[0-9]{4}|debug)\\b|(level|severity)[\"'=:\\s]+[\"']?debug\\b")
                - set(log.severity_text, "trace") where log.severity_text == nil and log.body != nil and IsMatch(log.body, "(?i)^trace\\b|(level|severity)[\"'=:\\s]+[\"']?trace\\b")
                - set(log.attributes["severity"], "fatal") where log.severity_text != nil and IsMatch(log.severity_text, "(?i)^(fatal|critical|panic)$")
                - set(log.attributes["severity"], "error") where log.severity_text != nil and IsMatch(log.severity_text, "(?i)^(error|err)$")
                - set(log.attributes["severity"], "warn") where log.severity_text != nil and IsMatch(log.severity_text, "(?i)^(warn|warning)$")
                - set(log.attributes["severity"], "debug") where log.severity_text != nil and IsMatch(log.severity_text, "(?i)^debug$")
                - set(log.attributes["severity"], "trace") where log.severity_text != nil and IsMatch(log.severity_text, "(?i)^trace$")
                - set(log.attributes["severity"], "info") where log.attributes["severity"] == nil
        groupbyattrs/severity:
          keys:
            - severity
      exporters:
        otlp_http/loki:
          endpoint: http://loki.observability.svc.cluster.local:3100/otlp
          compression: gzip
          timeout: 10s
          retry_on_failure:
            enabled: true
            initial_interval: 1s
            max_interval: 30s
            max_elapsed_time: 5m
          sending_queue:
            enabled: true
            num_consumers: 2
            queue_size: 256
      service:
        extensions:
          - health_check
          - file_storage
        telemetry:
          metrics:
            level: normal
            readers:
              - pull:
                  exporter:
                    prometheus:
                      host: $${env:MY_POD_IP}
                      port: 8888
        pipelines:
          logs:
            receivers:
              - file_log
            processors:
              - memory_limiter
              - transform/severity
              - groupbyattrs/severity
              - batch
            exporters:
              - otlp_http/loki
    extraVolumes:
      - name: varlogpods
        hostPath:
          path: /var/log/pods
          type: Directory
      - name: varlibotelcol
        hostPath:
          path: /var/lib/otelcol
          type: DirectoryOrCreate
    extraVolumeMounts:
      - name: varlogpods
        mountPath: /var/log/pods
        readOnly: true
      - name: varlibotelcol
        mountPath: /var/lib/otelcol
    ports:
      otlp:
        enabled: false
      otlp-http:
        enabled: false
      jaeger-compact:
        enabled: false
      jaeger-thrift:
        enabled: false
      jaeger-grpc:
        enabled: false
      zipkin:
        enabled: false
      metrics:
        enabled: true
        containerPort: 8888
        servicePort: 8888
        protocol: TCP
    podMonitor:
      enabled: true
      metricsEndpoints:
        - port: metrics
          interval: 30s
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
