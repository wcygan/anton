---
# Physical fan channels fan1 and fan2 are present on each MS-01. Other
# nct6775 channels are unused and report zero by design, so they are excluded.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: physical-fan-health
  labels:
    app.kubernetes.io/part-of: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    - name: physical-fan-health
      interval: 30s
      rules:
        - alert: NodePhysicalFanTelemetryMissing
          expr: |
            (
              label_replace(
                max by (instance, nodename) (node_uname_info{job="node-exporter"})
                  or on(instance)
                label_replace(
                  max by (instance) (up{job="node-exporter"} == 1),
                  "nodename", "$1", "instance", "(.+)"
                ),
                "sensor", "fan1", "instance", ".+"
              )
              or
              label_replace(
                max by (instance, nodename) (node_uname_info{job="node-exporter"})
                  or on(instance)
                label_replace(
                  max by (instance) (up{job="node-exporter"} == 1),
                  "nodename", "$1", "instance", "(.+)"
                ),
                "sensor", "fan2", "instance", ".+"
              )
            )
              and on(instance) (up{job="node-exporter"} == 1)
              unless on(instance, sensor)
                node_hwmon_fan_rpm{job="node-exporter",chip=~"platform_nct6775_.*",sensor=~"fan1|fan2"}
          for: 10m
          labels:
            severity: warning
            component: hardware
          annotations:
            summary: "Physical fan {{ $labels.sensor }} telemetry missing on {{ $labels.nodename }}"
            description: |
              The node-exporter target is reachable, but the expected nct6775
              {{ $labels.sensor }} reading has been absent for 10 minutes.
              Fan health is unknown. Check the Talos nct6775 module, host hwmon
              devices, and node-exporter hwmon collection. A missing reading does
              not mean the fan stopped. Unreachable exporters use TargetDown.
            runbook_url: "https://github.com/wcygan/anton/blob/main/docs/docs/guides/talos.md#fan-telemetry"
        - alert: NodePhysicalFanStoppedOrUnstable
          expr: |
            (
              avg_over_time(
                (node_hwmon_fan_rpm{sensor=~"fan1|fan2"} == bool 0)[10m:30s]
              ) >= 0.25
            )
              * on(instance) group_left(nodename) node_uname_info
          for: 5m
          labels:
            severity: critical
            component: hardware
          annotations:
            summary: "Physical fan {{ $labels.sensor }} stopped or unstable on {{ $labels.nodename }}"
            description: |
              {{ $labels.nodename }} reports {{ $labels.sensor }} at 0 RPM for at
              least 25% of samples over the last 10 minutes (observed fraction:
              {{ $value }}). This detects a sustained stop or intermittent stall.
              Inspect the fan, cabling, and chassis airflow before sustained load
              causes thermal throttling or a reset.
            runbook_url: "https://github.com/wcygan/anton/blob/main/docs/docs/records/reboot-and-thermal-investigation.md"
