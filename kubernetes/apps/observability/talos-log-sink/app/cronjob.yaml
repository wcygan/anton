# Daily retention: routine 1d, warnings/kernel/unknown 14d, errors 30d.
# Legacy mixed files age out after 30d to preserve historical error evidence.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: talos-log-sink-rotate
  namespace: observability
spec:
  schedule: "17 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: talos-log-sink-rotate
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: kubectl
              # renovate: datasource=docker depName=registry.k8s.io/kubectl
              image: registry.k8s.io/kubectl:v1.37.2
              imagePullPolicy: IfNotPresent
              # Distroless kubectl invokes directly via args (no shell); the
              # shell command runs inside the `rotator` busybox sidecar on the
              # vector pod, which mounts the same /vector-data-dir PVC.
              args:
                - exec
                - --namespace=observability
                - talos-log-sink-vector-0
                - -c
                - rotator
                - --
                - sh
                - -c
                - |
                  set -eu
                  cd /vector-data-dir
                  now=$(date -u +%s)
                  today=$(date -u +%F)
                  for file in talos-*.log; do
                    [ -f "$file" ] || continue
                    case "$file" in
                      talos-routine-*) days=1 ;;
                      talos-warning-*|talos-diagnostic-*) days=14 ;;
                      talos-error-*|talos-sink-*) days=30 ;;
                      *) continue ;;
                    esac
                    # Date in the filename avoids deletion caused by copied mtimes.
                    day=$${file%.log}
                    day=$${day##*talos-}
                    day=$${day#*-}
                    [ "$day" = "$today" ] && continue
                    stamp=$(date -u -d "$day 00:00:00" +%s) || exit 1
                    # Keep complete days plus today's open file.
                    if [ "$stamp" -lt "$((now / 86400 * 86400 - days * 86400))" ]; then
                      rm -- "$file"
                    fi
                  done
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
