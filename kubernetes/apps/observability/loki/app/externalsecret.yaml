---
# Reuse the existing SeaweedFS S3 admin identity without copying credentials
# into this repository. The storage-scoped source currently exposes no
# Loki-specific identity; keep this mapping narrow and document the temporary
# admin scope in the logging runbook.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: loki-s3-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        AWS_ACCESS_KEY_ID: "{{ .accessKey }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secretKey }}"
  data:
    - secretKey: accessKey
      remoteRef:
        key: "seaweedfs-harbor/admin-access-key"
    - secretKey: secretKey
      remoteRef:
        key: "seaweedfs-harbor/admin-secret-key"
