apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-recovery-namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-recovery-namespace
subjects:
  - kind: ServiceAccount
    name: cluster-recovery
    namespace: storage
