---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: harbor-retention-reconciler
    files:
      - reconcile.sh=./reconcile.sh
      - helpers.sh=./helpers.sh
      - protected-images.jq=./protected-images.jq
      - filer-persistence.jq=./filer-persistence.jq
      - reclamation.sh=./reclamation.sh
      - reclamation-gates.jq=./reclamation-gates.jq
    options:
      disableNameSuffixHash: true
resources:
  - ./postgres-cluster.yaml
  - ./dragonfly.yaml
  - ./networkpolicy-dragonfly.yaml
  - ./externalsecret-admin.yaml
  - ./externalsecret-s3.yaml
  - ./ingress-tailscale.yaml
  - ./prometheusrule.yaml
  - ./retention-cronjob.yaml
  - ./retention-rbac.yaml
  - ./retention-status.yaml
