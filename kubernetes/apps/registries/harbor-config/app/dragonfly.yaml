---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: harbor-redis
spec:
  replicas: 3
  image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2
  # Harbor's job queue and cache: stop after Harbor on node shutdown
  # (kube-system/priority-classes).
  priorityClassName: storage-service
  # NetworkPolicy is owned by GitOps. Operator v1.7.0 removed its managed
  # policy and the spec.networkPolicyEnabled field.

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: harbor-redis
              app.kubernetes.io/name: dragonfly
              app.kubernetes.io/part-of: dragonfly

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  args:
    # Harbor's redis usage is light (session + cache); 256MB is plenty.
    - --maxmemory=256mb
    # Single proactor thread is adequate for Harbor's traffic pattern.
    - --proactor_threads=1
