# Reconcile Harbor's project-scoped retention policies from Git. Harbor does
# not expose retention policies as a Kubernetes resource, so this bounded job
# uses the supported Harbor API and the existing admin-password Secret.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: harbor-retention-reconcile
  labels:
    app.kubernetes.io/name: harbor-retention
    app.kubernetes.io/part-of: harbor
spec:
  schedule: "30 1 * * *"
  timeZone: Etc/UTC
  suspend: false
  startingDeadlineSeconds: 900
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800 # Includes repeated inventory and execution completion checks.
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: harbor-retention
            app.kubernetes.io/part-of: harbor
        spec:
          restartPolicy: Never
          serviceAccountName: harbor-retention
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              # Existing Anton convention; this image includes curl and jq.
              image: alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
              args:
                - /opt/reconcile.sh
              env:
                - name: MODE
                  value: retention
                - name: HARBOR_API_URL
                  value: http://harbor-core/api/v2.0
                - name: HARBOR_USERNAME
                  value: admin
                - name: HARBOR_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: harbor-admin-secret
                      key: HARBOR_ADMIN_PASSWORD
                # Harbor's scheduler uses a six-field cron expression with
                # seconds. Run policy execution daily at 01:30 UTC.
                - name: HARBOR_RETENTION_CRON
                  value: "0 30 1 * * *"
                - name: HARBOR_PROTECTED_TAGS
                  value: "{in-use-*,rollback}"
                - name: HARBOR_IMAGE_HOST
                  value: "192.168.1.106"
                - name: HARBOR_GC_ENABLED
                  value: "true"
                - name: HARBOR_GC_CRON
                  value: "0 30 5 * * 0"
              volumeMounts:
                - name: reconciler
                  mountPath: /opt
                  readOnly: true
                - name: scratch
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
          volumes:
            - name: reconciler
              configMap:
                name: harbor-retention-reconciler
            - name: scratch
              emptyDir:
                sizeLimit: 64Mi
