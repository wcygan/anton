# NOT referenced by app/kustomization.yaml. Publish only after plan 0024's pilot.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: harbor-physical-reclamation
spec:
  schedule: "30 7 * * 0"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 0
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: harbor-reclamation
            app.kubernetes.io/part-of: harbor
        spec:
          restartPolicy: Never
          serviceAccountName: harbor-reclamation
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reclaim
              image: alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
              command: [/bin/sh, /opt/reclamation.sh]
              env:
                - name: MODE
                  value: apply-reclamation
                - name: HARBOR_API_URL
                  value: http://harbor-core/api/v2.0
                - name: HARBOR_USERNAME
                  value: admin
                - name: HARBOR_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: harbor-admin-secret
                      key: HARBOR_ADMIN_PASSWORD
                - name: HARBOR_RETENTION_CRON
                  value: "0 30 1 * * *"
                - name: HARBOR_PROTECTED_TAGS
                  value: "{in-use-*,rollback}"
                - name: HARBOR_IMAGE_HOST
                  value: "192.168.1.106"
                - name: HARBOR_GC_CRON
                  value: "0 30 5 * * 0"
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: scripts
                  mountPath: /opt
                  readOnly: true
                - name: work
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: harbor-retention-reconciler
            - name: work
              emptyDir:
                sizeLimit: 32Mi
