# NOT referenced by app/kustomization.yaml. Publish after successful pilot.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-reclamation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: harbor-reclamation-node-reader
rules:
  - apiGroups: [""]
    resources: [nodes]
    resourceNames: [k8s-1, k8s-2, k8s-3]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: harbor-reclamation-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: harbor-reclamation-node-reader
subjects:
  - kind: ServiceAccount
    name: harbor-reclamation
    namespace: registries
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: harbor-reclamation-workload-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: harbor-retention-workload-reader
subjects:
  - kind: ServiceAccount
    name: harbor-reclamation
    namespace: registries
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harbor-reclamation-evidence
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: harbor-retention-evidence
subjects:
  - kind: ServiceAccount
    name: harbor-reclamation
    namespace: registries
