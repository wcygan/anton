---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spark-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: spark-operator
      version: 1.8.0
      sourceRef:
        kind: HelmRepository
        name: spark-operator
  values:
    spark-operator:
      controller:
        watchNamespace: lakehouse
        replicaCount: 1
      webhook:
        enable: true
