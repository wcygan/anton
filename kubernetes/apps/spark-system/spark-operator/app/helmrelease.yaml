---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spark-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: spark-kubernetes-operator
      version: 1.8.0
      sourceRef:
        kind: HelmRepository
        name: spark-operator
  # The chart omits deletecollection from the Spark workload Role. Spark uses
  # this verb to remove selector-scoped Services and PVCs during shutdown.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Role
              name: spark-workload-role
            patch: |
              - op: add
                path: /rules/0/verbs/-
                value: deletecollection
  values:
    image:
      repository: apache/spark-kubernetes-operator
      tag: 1.0.0
      pullPolicy: IfNotPresent
    operatorDeployment:
      replicas: 1
    operatorRbac:
      serviceAccount:
        create: true
        name: spark-operator
      clusterRole:
        create: true
        name: spark-operator-clusterrole
      clusterRoleBinding:
        create: true
        name: spark-operator-clusterrolebinding
      role:
        create: true
        name: spark-operator-role
      roleBinding:
        create: true
        name: spark-operator-rolebinding
        roleRef:
          kind: Role
          name: spark-operator-role
    workloadResources:
      namespaces:
        create: true
        overrideWatchedNamespaces: true
        data:
          - lakehouse
      serviceAccount:
        create: true
        name: spark
      role:
        create: true
        name: spark-workload-role
      clusterRole:
        create: false
      roleBinding:
        create: true
        name: spark-workload-rolebinding
