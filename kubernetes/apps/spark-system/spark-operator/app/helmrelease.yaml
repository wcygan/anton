---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spark-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: spark-operator
      version: 2.5.2
      sourceRef:
        kind: HelmRepository
        name: spark-operator
  values:
    controller:
      replicas: 1
    webhook:
      enable: true
    spark:
      jobNamespaces:
        - lakehouse
